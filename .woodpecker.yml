# Woodpecker CI/CD pipeline.
#
# No deploy step: this is a test-harness library, not a web service/site.
# This pipeline is purely the gate: if a step fails, the push must not
# count as "green".
#
# Every step calls scripts/verify.sh or scripts/local-ci-checks.sh — the
# same scripts used locally (.githooks/pre-commit, .githooks/pre-push).
# Single source of truth: a step here is just a name plus which
# (sub)command, never separately-maintained logic.
#
# gitleaks/env-guard/test also run on pull_request (this is a public repo —
# an external contributor's PR gets the same feedback before merge as a
# direct push does). sonarqube stays push-to-main-only: it's the only step
# that reads secrets (SONAR_HOST_URL/SONAR_TOKEN), and a fork's PR pipeline
# must never get access to those, regardless of how Woodpecker itself
# scopes secrets for forks — this is enforced here, not assumed.

when:
  - event: push
    branch: main
  - event: pull_request

clone:
  git:
    image: woodpeckerci/plugin-git@sha256:550075c844fcec0af41d9d28f9860aa5d8c43e1e9419be4b9266dc02c2f29804
    settings:
      depth: 0
      partial: false

steps:
  - name: gitleaks
    # Scans the full history (clone block above: depth 0, partial false).
    # scripts/secret-scan.sh fails on a shallow or partial clone and on a
    # commit count below the commits with added non-binary lines, and runs a
    # self-test with a planted secret first. No fallback: CI never degrades
    # to a staged-only scan. No baseline is used (full history is clean).
    image: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    commands:
      - sh scripts/secret-scan.sh selftest
      - sh scripts/secret-scan.sh
    when:
      - event: push
        branch: main
      - event: pull_request

  - name: env-guard
    # Belt-and-suspenders alongside gitleaks: .env is in .gitignore, but
    # `git add -f` slips right past .gitignore. alpine has no git by
    # default — without this apk add, `git ls-files` fails silently and
    # the check would be vacuously skipped.
    image: alpine:3.20
    commands:
      - apk add --no-cache git
      - ./scripts/local-ci-checks.sh --strict env-guard
    when:
      - event: push
        branch: main
      - event: pull_request

  - name: backlog-check
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    commands:
      - apk add --no-cache python3
      - python3 -I scripts/backlog-check/src/check_backlogs.py --file BACKLOG.md --name workflow-script-harness
    when:
      - event: push
        branch: main

  - name: docs-check
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    commands:
      - apk add --no-cache python3
      - python3 -I scripts/docs-check/check_repo_docs.py
    when:
      - event: push
        branch: main

  - name: vuln-scan
    # Blocking: a CRITICAL/HIGH with an available fix fails the build; --ignore-unfixed skips CVEs without a fix; --include-dev-deps because this repo has only devDependencies.
    image: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
    commands:
      - trivy fs --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --include-dev-deps --format table .
    depends_on: [test]
    when:
      - event: push
        branch: main

  - name: sbom
    # devops-stack-uitbreiding item 5: SBOM-generatie, informatief. GEEN
    # officieel anchore/syft-image (distroless/geen /bin/sh op het pad
    # Woodpecker verwacht) -- syft installeren via het officiële
    # install-script, gepind naar v1.19.0, geverifieerd via sha256sum.
    image: alpine:3.20
    environment:
      SYFT_VERSION: v1.19.0
    commands:
      - apk add --no-cache curl
      - curl -sSfL "https://raw.githubusercontent.com/anchore/syft/$SYFT_VERSION/install.sh" -o install.sh
      - echo "709ae9171e3d44e456a111943c341d0bf0fd2176b41af124d019823a70c34a3f  install.sh" | sha256sum -c -
      - sh install.sh -b /usr/local/bin "$SYFT_VERSION"
      - syft . -o table
    depends_on: [test]
    when:
      - event: push
        branch: main

  - name: test
    # node:22 (not -slim): no extra OS deps needed for node:test or
    # cucumber-js, and it's the same major version used in local development.
    image: node:22
    commands:
      - npm ci
      - ./scripts/verify.sh unit
      - ./scripts/verify.sh bdd
      - ./scripts/verify.sh coverage
    when:
      - event: push
        branch: main
      - event: pull_request

  - name: sonarqube
    # sonar_host_url/sonar_token are GLOBAL Woodpecker secrets on this
    # instance (shared with the other repos). coverage.lcov comes from the
    # preceding "test" step (shared workspace within one pipeline run).
    # push-to-main only (see the file-level comment above) — never runs on
    # pull_request, so a fork PR is never handed these secrets.
    image: sonarsource/sonar-scanner-cli@sha256:23ca0f137965d9dff2198074043fd48d386280bc5d0ccac8c8349cea4cf096a9
    environment:
      SONAR_HOST_URL:
        from_secret: sonar_host_url
      SONAR_TOKEN:
        from_secret: sonar_token
    commands:
      - apk add --no-cache git || true
      - git fetch --unshallow 2>/dev/null || true
      - ./scripts/local-ci-checks.sh --strict sonarqube
    depends_on: [test]
    when:
      - event: push
        branch: main
        path:
          exclude: ['**/*.md', 'docs/**']
