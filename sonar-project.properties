# javascript:S1523 ("dynamic injection or execution of code") on
# src/harness.js: this project's entire purpose is a vm-based sandbox —
# vm.runInContext()/vm.runInNewContext() are the deliberate, reviewed
# core mechanism (see research.md Challenge 1/2), not an incidental
# dynamic-eval vulnerability. There is no way to build this harness
# without them; suppressing the rule here rather than pretending it's
# "fixed" or silencing it project-wide.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S1523
sonar.issue.ignore.multicriteria.e1.resourceKey=src/harness.js
