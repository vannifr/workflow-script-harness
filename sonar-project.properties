# javascript:S1523 ("dynamic injection or execution of code") on
# src/harness.js: this project's entire purpose is a vm-based sandbox —
# vm.runInContext()/vm.runInNewContext() are the deliberate, reviewed
# core mechanism (see research.md Challenge 1/2), not an incidental
# dynamic-eval vulnerability. There is no way to build this harness
# without them; suppressing the rule here rather than pretending it's
# "fixed" or silencing it project-wide.
# javascript:S7773 ("prefer Number.isNaN/parseInt/parseFloat/isFinite")
# on the SAFE_ES_BUILTINS object: these bare-global references are
# captured to EXPOSE the classic, coercing global functions to sandboxed
# scripts (matching what any script author expects `isNaN(x)` etc. to
# mean) — swapping to Number.isNaN/Number.parseInt/etc. here would be a
# genuine BEHAVIOR CHANGE (they don't coerce), not a style fix.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S1523
sonar.issue.ignore.multicriteria.e1.resourceKey=src/harness.js
sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S7773
sonar.issue.ignore.multicriteria.e2.resourceKey=src/harness.js
